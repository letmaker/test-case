<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:," />
    <title>游戏手机测试</title>
    <style>
      html { background: #000; color: #eee; font: 16px system-ui, sans-serif; }
      body { margin: 0; }
      .panel { width: min(22rem, 86vw); margin: 8vh auto 0; }
      #password, #games a { display: block; box-sizing: border-box; font: inherit; padding: .65rem .8rem; }
      #password { appearance: none; background: transparent; border-color: transparent; outline: none; color: transparent; cursor: default; }
      #password:focus { color: inherit; cursor: text; }
      #start { position: absolute; top: 16px; left: 0; right: 0; margin: 0; text-align: center; }
      #password[hidden] + #start { display: none; }
      #games a { margin: .75rem 0; color: #fff; background: #27354a; border-radius: .45rem; text-decoration: none; }
      #game-switch { position: fixed; top: 10px; left: 10px; z-index: 10000; padding: 5px; font-size: 14px; field-sizing: content; }
      #loading { position: relative; z-index: 1000; width: fit-content; margin: 12px auto 0; padding: 8px 12px; background: #181d25; }
      [hidden] { display: none !important; }
    </style>
    <script type="module" crossorigin src="./assets/index-Dd6GYLMG.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/preload-helper-HclGiUj8.js">
  </head>
  <body>
    <input id="password" class="panel" type="password" aria-label="测试密码" autocomplete="off" hidden />
    <p id="start">start</p>
    <main id="menu" class="panel" hidden>
      <h1>选择游戏</h1>
      <nav id="games" aria-label="测试游戏"></nav>
    </main>
    <select id="game-switch" aria-label="切换测试" hidden></select>
    <p id="loading" role="status" hidden></p>
  </body>
</html>
